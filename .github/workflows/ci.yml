name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: oracle test (exact-match + RAM budget)
        run: make test
      - name: bench smoke
        run: make vireo && ./vireo bench 50000 topk
      - name: format check
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          clang-format --dry-run src/*.c src/*.h src/select/*.c src/select/*.h
